name: release

# builds native jackc binaries for each platform, attaches them to a GitHub
# Release, and (for [publish] commits) publishes the npm package.
#
# to ship a release: bump "version" in Compiler/npm/package.json, then push a
# commit whose message starts with [publish]. the workflow creates the matching
# v<version> tag + release and publishes to npm, so postinstall's download URLs
# line up with what npm serves.
#
# pushing a v* tag by hand still builds + attaches binaries, but skips npm.
# note: macos-13 (intel) is gone - github retired those runners, so there is
# no darwin-x64 binary; postinstall tells intel mac users there's no build.
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch: # manual runs from the Actions tab (build only)

permissions:
  contents: write # create the release + upload assets

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.event.head_commit.message, '[publish]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # apple silicon
            asset: jackc-darwin-arm64
            binary: jackc
          - os: ubuntu-latest
            asset: jackc-linux-x64
            binary: jackc
          - os: windows-latest
            asset: jackc-win32-x64.exe
            binary: jackc.exe
    runs-on: ${{ matrix.os }}
    steps:
      # windows checks symlinks out as plain text files unless told otherwise -
      # the OS/*.vm links would get baked into the binary as garbage (build.sh
      # also guards against this and fails loudly)
      - name: enable symlinks on windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"

      - name: build native binary
        shell: bash
        run: bash Compiler/build.sh

      - name: rename to platform asset name
        shell: bash
        run: mv "Compiler/${{ matrix.binary }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: work out the release tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(jq -r .version Compiler/npm/package.json)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create release + attach binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*

  publish-npm:
    needs: release
    if: startsWith(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: publish to npm
        working-directory: Compiler/npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
